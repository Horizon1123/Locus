name: Build Waypoint native timeout test
on:
  push:
    branches: ['codex/waypoint-test-20261117']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          repository: raph559/WaypointApp
          ref: 61809b6348df5b835745ec17c61e4d81ed93d705
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: locus-test-build-tools
          persist-credentials: false
      - name: Adapt port and instrument cellular test
        run: |
          python3 locus-test-build-tools/.github/scripts/adapt-waypoint-test.py
          git diff --check
          git diff > waypoint-port.patch
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-ios
      - name: Build native timeouts with developer-image support
        env:
          LOCUS_NATIVE_FEATURES: ring dvt location_simulation remote_pairing tunnel_tcp_stack obfuscate mobile_image_mounter tss
        run: |
          bash locus-test-build-tools/Vendor/idevice/build-locus-library.sh
          cp locus-test-build-tools/Vendor/idevice/libidevice_ffi.a Vendor/idevice/
          cp locus-test-build-tools/Vendor/idevice/idevice.h Vendor/idevice/
          cp locus-test-build-tools/Vendor/idevice/locus-timeout.patch native-timeout.patch
          cp locus-test-build-tools/Vendor/idevice/build-locus-library.sh native-build-recipe.sh
          shasum -a 256 Vendor/idevice/libidevice_ffi.a Vendor/idevice/idevice.h > native-SHA256SUMS
          tar -czf Waypoint-native-source.tar.gz --exclude .git --exclude target -C locus-test-build-tools/Vendor/idevice-build .
      - name: Generate project and build
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Waypoint.xcodeproj -scheme Waypoint -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION=16 IPHONEOS_DEPLOYMENT_TARGET=18.0 build 2>&1 | tee build.log
      - name: Package app and corresponding source
        run: |
          mkdir -p package/Payload
          ditto build/Build/Products/Release-iphoneos/Waypoint.app package/Payload/Waypoint.app
          (cd package && /usr/bin/zip -qry ../Waypoint-1.0.5-build16.ipa Payload)
          { git ls-files -z; printf 'native-timeout.patch\0native-build-recipe.sh\0native-SHA256SUMS\0'; } | tar --null -T - -czf Waypoint-1.0.5-build16-source.tar.gz
          shasum -a 256 Waypoint-1.0.5-build16.ipa > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: Waypoint-build16
          path: |
            Waypoint-1.0.5-build16.ipa
            Waypoint-1.0.5-build16-source.tar.gz
            waypoint-port.patch
            SHA256SUMS
            native-SHA256SUMS
            Waypoint-native-source.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Waypoint-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
